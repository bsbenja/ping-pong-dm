contributes:
  formats:
    typst:
      title: DM i Ping Pong 2026 # ANGIV titel
      subtitle: Danmarksmesterskaberne i klassisk bordtennis på lige vilkår # ANGIV undertitel
      date: 2026-05-16 # ANGIV dato i formatet ÅÅÅÅ-MM-DD
      var_organizer_name: Sisu/MBK # ANGIV arrangørens name
      var_organizer_address: Nørre Boulevard 1 # ANGIV arrangørens address
      var_organizer_postal_code: 8000 # ANGIV arrangørens postal_code
      var_organizer_city: Aarhus C # ANGIV arrangørens by
      var_hex_theme_1: '#ED1846' # ANGIV hex-farvekode for tema 1
      var_hex_theme_2: '#211D71' # ANGIV hex-farvekode for tema 2
      var_hex_body_text: '#FFFFFF' # ANGIV hex-farvekode for brødtekst
      var_page_width: 820pt # ANGIV sidens bredde
      var_page_height: 360pt # ANGIV sidens højde
      var_page_margin_x: 108pt # ANGIV x-margen (90pt*1.2)
      var_page_margin_y: 38.4pt # ANGIV y-margen (24pt*1.6)
      var_page_background: billede/baggrund/wcpp-2020.png # ANGIV sti som baggrundsbillede eller hex-farvekode som baggrundsfarve
      var_text_font: Arial # ANGIV skrifttype
      var_text_size: 16.6pt # ANGIV skriftstørrelse

      lang: da
      date-format: dddd [d. ] D. MMMM YYYY
      keep-typ: false
      shift-heading-level-by: 0
      template-partials:
        - typst-template.typ
        - typst-show.typ
      filters:
       - filter.lua
      execute:
        echo: false
        warning: false