# I denne fil defineres grundlæggende Pandoc metadata samt format

contributes:
  formats:
    typst:
      title: DM i Ping Pong 2026 # ANGIV titel
      date: 05/16/2026 # ANGIV dato i formatet MM/DD/ÅÅÅÅ
      mainfont: Arial # ANGIV skrifttype
      fontsize: 16.6pt # ANGIV skriftstørrelse
      var_organizer:
        name: Sisu/MBK # ANGIV arrangørens name
        address: Nørre Boulevard 1 # ANGIV arrangørens address
        postal_code: 8000 # ANGIV arrangørens postal_code
        city: Aarhus C # ANGIV arrangørens by
      var_hex:
        theme_1: '#ED1846' # ANGIV hex-farvekode for tema 1
        theme_2: '#211D71' # ANGIV hex-farvekode for tema 2
        body_text: '#FFFFFF' # ANGIV hex-farvekode for brødtekst
      var_page:
        width: 820pt # ANGIV sidens bredde
        height: 360pt # ANGIV sidens højde
        margin_x: 108pt # ANGIV x-margen (90pt*1.2)
        margin_y: 38.4pt # ANGIV y-margen (24pt*1.6)
        fill: false # ANGIV hex-farvekode for sidens baggrundsfarve, ellers false
        background: billede/baggrund/wcpp-2020.png # ANGIV sti til baggrundsbillede, ellers false

      lang: da
      date-format: dddd [d. ] D. MMMM YYYY
      keep-typ: false
      shift-heading-level-by: 0
      template-partials:
        - typst-template.typ
        - typst-show.typ
      filters:
       - filter.lua
      execute:
        echo: false
        warning: false