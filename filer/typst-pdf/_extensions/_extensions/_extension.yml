# I denne fil defineres grundlæggende Pandoc metadata samt format

contributes:
  formats:
    typst:
      lang: da
      date-format: dddd [d. ] D. MMMM YYYY
      keep-typ: false
      shift-heading-level-by: 0
      metadata-files:
        - _variables.yml
      template-partials:
        - typst-template.typ
        - typst-show.typ
      execute:
        echo: false
        warning: false