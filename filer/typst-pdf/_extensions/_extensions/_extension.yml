# I denne fil defineres grundlæggende Pandoc metadata samt format

contributes:
  formats:
    typst:
      title: DM i Ping Pong 2026 # ANGIV titel
      date: 05/16/2026 # ANGIV dato i formatet MM/DD/ÅÅÅÅ
      author_name: Sisu/MBK # ANGIV arrangørens navn
      author_address: Nørre Boulevard 1 # ANGIV arrangørens adresse
      author_postal_code: 8000 # ANGIV arrangørens postnummer
      author_city: Aarhus C # ANGIV arrangørens by
      hex_theme_1: ED1846 # ANGIV hex-farvekode for tema 1
      hex_theme_2: 211D71 # ANGIV hex-farvekode for tema 2
      hex_body_text: FFFFFF # ANGIV hex-farvekode for brødtekst
      fontsize: 16.6pt # ANGIV skriftstørrelse

      lang: da
      date-format: dddd [d. ] D. MMMM YYYY
      keep-typ: false
      shift-heading-level-by: 0
      template-partials:
        - typst-template.typ
        - typst-show.typ
      filters:
       - filter.lua
      execute:
        echo: false
        warning: false