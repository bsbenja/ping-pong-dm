contributes:
  formats:
    typst:
      lang: da
      date-format: dddd [d. ] D. MMMM YYYY
      keep-typ: false
      shift-heading-level-by: 0
      template-partials:
        - typst-template.typ
        - typst-show.typ
      filters:
       - filter.lua
      execute:
        echo: false
        warning: false