project:
  type: website
  render:
    - '*.qmd'
    - 'index.qmd' # '!index.qmd'
    - 'dashboard.qmd' # '!dashboard.qmd'
    - '!raekke-sandpapir-aaben-single.qmd' # '!raekke-sandpapir-aaben-single.qmd'
    - '!regler.qmd' # '!regler.qmd'
    - '!wcpp.qmd' # '!wcpp.qmd'
    - '!koncept.qmd' # '!koncept.qmd'
    - '!indbydelse-tilmelding-2023.qmd' # '!indbydelse-tilmelding-2023.qmd'
    - '!bi.qmd' # '!bi.qmd'
    - '!bi2.qmd' # '!bi2.qmd'
    - '!filer/**/*.qmd' # Quarto-dokumenter i mappen filer skal køres manuelt

website:
  site-url: 'https://pingpong.quarto.pub/dm'
  favicon: 'filer/medie/billede/ping-pong-dk.png'
  title: 'Ping Pong DM - Uofficiel hjemmeside'
  google-analytics: 'G-6903XX1GX6'
  page-navigation: true
  back-to-top-navigation: false
  sidebar:
    style: docked
    background: light
    logo: 'filer/medie/billede/ping-pong-dk.png'
    title: false
    search: true
    border: true
    contents:
      - href: 'index.qmd'
      - href: 'dashboard.qmd'
        text: '<iconify-icon icon=mdi:chart-box></iconify-icon> <u>Dashboard</u>'
      - text: '<a href=https://bordtennisdanmark.dk/velkommen/proev-ping-pong/ping-pong-regler/ target=_blank><iconify-icon icon=mdi:open-in-new></iconify-icon> <u>Ping Pong regler</u></a>'
  page-footer:
    background: light
    border: true
    center:
      - text: |
          <a style=font-weight:bold;font-size:18px;text-decoration:none href=index.qmd><img src=filer/medie/billede/ping-pong-dk.png style=height:18px>&nbsp;Ping Pong DM</a>
          <br><br>
          <a href=https://www.facebook.com/{{< var var.facebook_side_id >}} target=_blank><span class=bi-facebook style=color:#1877F2;font-size:18px></span></a>
          &nbsp;<a href=https://m.me/{{< var var.facebook_side_id >}} target=_blank><span class=bi-messenger style=color:#0695FF;font-size:18px></span></a>
          &nbsp;<a href=https://github.com/bsbenja/ping-pong-dm target=_blank><span class=bi-github style=color:#9F7BE1;font-size:18px></span></a>

format:
  html:
    theme:
      light: [flatly, filer/kode/scss/tema.scss, filer/kode/scss/tema-lys.scss]
      dark: [darkly, filer/kode/scss/tema.scss, filer/kode/scss/tema-moerk.scss]
    df-print: default
    html-table-processing: none
    cap-location: bottom
    fig-align: left
    toc-location: right
    toc-depth: 3
    toc-expand: true
    toc: true
    smooth-scroll: true
    code-tools: false
    anchor-sections: false
    fig-dpi: 300
    white-space: pre-wap
    code-overflow: wrap
    header-includes: |
      <script src="https://code.iconify.design/iconify-icon/1.0.2/iconify-icon.min.js"></script>
      <meta name="google-site-verification" content="izkomDopuYjTHjF7B1NJSGr0ea8hNGw968SgEtk8n8g">

knitr:
  opts_chunk:
    comment: ""

execute:
  eval: true
  output: true
  freeze: false
  echo: false
  warning: false
  error: false